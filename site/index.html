<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tom Christin-Leymarie — Art direction & graphic design</title><meta name="description" content="Portfolio of Tom Christin-Leymarie, art director and graphic designer based in Paris: visual identity, publishing, typography, textiles and AI."><meta name="theme-color" content="#ffffff"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%223%22 fill=%22%230A0A0A%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Helvetica,Arial%22 font-size=%2215%22 text-anchor=%22middle%22 fill=%22white%22%3ETC%3C/text%3E%3C/svg%3E"><meta property="og:title" content="Tom Christin-Leymarie — Portfolio"><meta property="og:description" content="Portfolio of Tom Christin-Leymarie, art director and graphic designer based in Paris: visual identity, publishing, typography, textiles and AI."><meta property="og:type" content="website"><link rel="preload" as="image" href="media/5e02613e52ed3c48a47524667c3fc78a-p1.webp" fetchpriority="high"><link rel="preload" as="image" href="media/b8295122cc050d008af9b87da5b7c93b-p1.webp" fetchpriority="high"><link rel="preload" as="image" href="media/5b7b9d5cd680446695dd168ca4858205-t1.webp"><link rel="preload" as="image" href="media/4b715b81d587cd1120f0eb08e8fa46b8-p1.webp"><link rel="preload" as="font" type="font/woff2" href="media/2c8ef60969cbca101c56bae2bc93200c.woff2" crossorigin><link rel="preload" as="font" type="font/woff2" href="media/6acc6d3ab3a3fc3a23c14c91eab1cb3d.woff2" crossorigin><style>body{margin:0}</style></head><body>


<link id="pf-fonts" rel="alternate" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;1,400&amp;display=swap">
<style id="pf-style">
/* Grille suisse 12 colonnes, colonne de libellés à gauche comme sur le CV. Une seule famille grotesque : la hiérarchie vient de la position et de la taille, jamais de la graisse. */
:root{
  --bg:#FFFFFF; --fg:#0A0A0A; --muted:#707070; --tile:#EEEEEE; --line:#DEDEDE; --danger:#C0281F;
  --font:"PF Grotesk","Neue Haas Grotesk Display Pro","Neue Haas Grotesk Display","NHaasGroteskDSPro-55Rg","Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fs-s:.8125rem; --fs-m:clamp(.9375rem,.86rem + .22vw,1.0625rem); --fs-l:clamp(1.5rem,1.05rem + 1.45vw,2.5rem); --fs-xl:clamp(3rem,1.2rem + 7.6vw,10rem); --fs-mail:clamp(2rem,.9rem + 4.4vw,5.75rem);
  --gutter:clamp(12px,1.5vw,20px); --margin:clamp(16px,2.8vw,40px);
  color-scheme:light;
}
:root[data-look="noir"]{--bg:#0B0B0B; --fg:#EDEDED; --muted:#8E8E8E; --tile:#1A1A1A; --line:#2B2B2B; --danger:#FF7A70; color-scheme:dark}

*{box-sizing:border-box}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs-m);line-height:1.22;letter-spacing:-.006em;font-kerning:normal;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
p,h1,h2,h3,dl,dd,figure,ul{margin:0}
h1,h2,h3{font-size:inherit;font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{padding-left:max(var(--margin),env(safe-area-inset-left,0px));padding-right:max(var(--margin),env(safe-area-inset-right,0px))}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gutter)}
.u:hover,.u:focus-visible{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}

/* Repères d'impression */
.marks{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 0}
.bar{display:flex;outline:1px solid var(--fg)}
.bar i{display:block;width:clamp(6px,1.35vw,20px);height:clamp(9px,1.35vw,20px)}
.reg{display:block;width:clamp(16px,1.6vw,22px);height:auto;color:var(--fg)}

/* En-tête */
.hdr{padding-block:clamp(20px,2.4vw,32px) 0;align-items:start}
.h-name{grid-column:1/4;white-space:pre-line}
.h-disc{grid-column:6/9;white-space:pre-line}
.h-nav{grid-column:10/13;justify-self:end;display:grid;justify-items:end}

/* Texte d'ouverture */
.intro{padding-block:clamp(88px,13vw,200px) clamp(64px,9vw,140px)}
.st{grid-column:1/10;font-size:var(--fs-l);line-height:1.1;letter-spacing:-.02em;white-space:pre-line;text-wrap:pretty}

/* Travaux */
.sh{align-items:baseline;margin-bottom:clamp(16px,2vw,28px)}
.lab{grid-column:1/3}
.switch{grid-column:3/7;display:flex;gap:1.2em}
.switch button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted)}
.switch button:hover,.switch button[aria-pressed="true"]{color:var(--fg)}
.count{grid-column:11/13;justify-self:end;color:var(--muted);font-variant-numeric:tabular-nums}

.works{row-gap:clamp(48px,6.5vw,104px)}
.tile{position:relative;min-width:0;grid-column:span 6}
.tile[data-size="L"]{grid-column:span 12}
.tile[data-size="S"]{grid-column:span 4}
.t-media{position:relative;overflow:hidden;background:var(--tile);aspect-ratio:4/5;--fr:.8;max-width:100%}
.tile[data-size="L"] .t-media{aspect-ratio:16/9;--fr:1.77778}
.t-media img,.t-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;padding:12px 14px;color:var(--muted);font-size:var(--fs-s)}
[data-err]{position:relative}
[data-err] img,[data-err] video{visibility:hidden}
[data-err]::after{content:"L'image ne s'affiche pas. Réimporte-la.";position:absolute;inset:0;padding:12px 14px;color:var(--danger);font-size:var(--fs-s);background:var(--tile);z-index:1}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:var(--tile);color:var(--fg);font-size:var(--fs-s);z-index:1}
.cap{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--gutter);margin-top:.65em}
.c-t{grid-column:1;grid-row:1;min-width:0}
.c-y{grid-column:2;grid-row:1;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-c{grid-column:1/-1;grid-row:2;font-style:italic;min-width:0}
@media (min-width:761px){
  .tile[data-size="L"] .cap{grid-template-columns:repeat(12,minmax(0,1fr))}
  .tile[data-size="L"] .c-t{grid-column:1/6}
  .tile[data-size="L"] .c-c{grid-column:6/10;grid-row:1}
  .tile[data-size="L"] .c-y{grid-column:10/13;grid-row:1}
  .tile[data-size="M"] .cap{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tile[data-size="M"] .c-t{grid-column:1/4}
  .tile[data-size="M"] .c-c{grid-column:4/6;grid-row:1}
  .tile[data-size="M"] .c-y{grid-column:6/7;grid-row:1}
}
.hit{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;padding:0;cursor:pointer;z-index:1}
.tile:hover .c-t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}

.ix{border-bottom:1px solid var(--line)}
.ix-row{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.55em 0 .6em;align-items:baseline;row-gap:.35em;cursor:pointer}
div.ix-row{cursor:default}
.x-t{grid-column:3/6;min-width:0}
.x-c{grid-column:6/8;font-style:italic;min-width:0}
.x-y{grid-column:8/10;font-variant-numeric:tabular-nums}
.x-d{grid-column:10/13;min-width:0}
.x-tools{grid-column:3/13}
@media (hover:hover){
  .ix.live:hover .ix-row{color:var(--muted)}
  .ix.live .ix-item:hover .ix-row,.ix.live .ix-item:focus-within .ix-row{color:var(--fg)}
}
/* Bandeau d'aperçu sous chaque projet de l'index : s'ouvre au survol, défile de droite à gauche en boucle */
.ix-strip{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s linear}
.ix-strip > div{overflow:hidden;min-height:0}
@media (hover:hover){.ix-item.has-media:hover .ix-strip,.ix-item.has-media:focus-within .ix-strip{grid-template-rows:1fr}}
.ix-band{display:block;width:100%;height:clamp(84px,8.5vw,132px);margin:0 0 .7em;padding:0;border:0;background:none;overflow:hidden;cursor:pointer;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent)}
.ix-track{display:flex;height:100%;width:max-content;animation:ix-marquee var(--dur,30s) linear infinite;animation-play-state:paused}
.ix-item:hover .ix-track,.ix-item:focus-within .ix-track{animation-play-state:running}
.ix-track > img,.ix-track > video{display:block;flex:none;height:100%;width:auto;margin-right:8px;object-fit:cover;background:var(--tile)}
@keyframes ix-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.ix-track{animation:none}.ix-band{overflow-x:auto;-webkit-mask-image:none;mask-image:none}}
.add{margin-top:clamp(24px,3vw,40px)}

/* Contact */
.ct{padding-top:clamp(120px,16vw,240px);row-gap:1.6em;align-items:baseline}
.ct .lab{grid-row:1}
.ct-i{grid-column:3/8;grid-row:1;white-space:pre-line}
.ct-e{grid-column:3/13;display:flex;flex-wrap:wrap;align-items:baseline;gap:.6em 1.6em;min-width:0}
.mail{font-size:var(--fs-mail);line-height:1;letter-spacing:-.035em;overflow-wrap:anywhere;min-width:0}
.copy{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
.copy:hover{color:var(--fg)}
.ct-l{grid-column:3/13;list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:.4em 2em}
.ct-le{grid-column:3/13;display:grid;gap:8px}
.le-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.e-lab{display:block;font-size:var(--fs-s);color:var(--muted);margin-bottom:.4em}
.input{font:inherit;font-size:var(--fs-s);padding:.5em .6em;border:1px solid var(--fg);border-radius:0;background:var(--bg);color:var(--fg);min-width:0;flex:1 1 240px}

/* Ligne de pied (slug) */
.slug{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:clamp(96px,12vw,180px) 18px;font-size:11px;letter-spacing:0;font-variant-numeric:tabular-nums}
.slug .reg{width:18px}
.can-edit .slug{padding-bottom:84px}

/* Fiche projet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sbar{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sbar .g{padding-block:14px;align-items:center}
.back{grid-column:1/4;justify-self:start;background:none;border:0;padding:0;cursor:pointer}
.sb-reg{grid-column:6/8;justify-self:center;display:flex}
.sb-n{grid-column:10/13;justify-self:end;font-variant-numeric:tabular-nums}
.s-head{padding-top:clamp(40px,7vw,120px);row-gap:clamp(28px,4vw,56px)}
.s-t{grid-column:1/-1;font-size:var(--fs-xl);line-height:.9;letter-spacing:-.045em;overflow-wrap:anywhere;text-wrap:balance}
.s-lead{grid-column:3/11;font-size:var(--fs-l);line-height:1.12;letter-spacing:-.02em;white-space:pre-line;text-wrap:pretty}
.s-info{margin-top:clamp(48px,6vw,96px);row-gap:2em;align-items:start}
.facts{grid-column:1/6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:var(--gutter);row-gap:.55em}
.f-row{display:contents}
.facts dt{grid-column:1/3}
.facts dd{grid-column:3/6;min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:.5em;align-items:baseline}
.facts dd.it{font-style:italic}
.s-desc{grid-column:7/13;white-space:pre-line;line-height:1.38;max-width:62ch}
.s-cover{margin-top:clamp(48px,6vw,96px);position:relative;overflow:hidden;background:var(--tile)}
.s-cover img,.s-cover video,.gi img,.gi video{display:block;width:100%;height:auto}
.s-ph{aspect-ratio:16/9;max-width:100%;padding:12px 14px;color:var(--muted);font-size:var(--fs-s)}
.m-tools{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px;z-index:2}
.s-gal{margin-top:var(--gutter);row-gap:var(--gutter)}
.s-gal:first-child{margin-top:clamp(48px,6vw,96px)}
/* apparition des images de la fiche au défilement */
.gi .gbox{transition:opacity .9s linear,transform 1.1s linear,clip-path 1.1s linear}
.gi.rv-wait .gbox{opacity:0;transform:translateY(48px);clip-path:inset(0 0 18% 0)}
.gi .gbox{clip-path:inset(0 0 0 0)}
.gi{position:relative;grid-column:span 12;min-width:0}
.gbox{position:relative;overflow:hidden;background:var(--tile)}
/* le gris ne sert qu'au chargement : une fois l'image affichée, un PNG détouré laisse voir le fond du site */
.t-media.is-ld,.s-cover.is-ld,.gbox.is-ld,.hero-media.is-ld,.ix-track > img.is-ld{background:transparent}
.g-tools{display:flex;flex-wrap:wrap;gap:4px;padding-top:8px}
.s-next{padding-top:clamp(120px,15vw,240px);align-items:baseline}
.nx{grid-column:3/13;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:grid;gap:.5em;justify-items:start;min-width:0}
.nx-t{font-size:var(--fs-xl);line-height:.9;letter-spacing:-.045em;overflow-wrap:anywhere;text-wrap:balance}
.nx:hover .nx-t,.nx:focus-visible .nx-t{text-decoration:underline;text-decoration-thickness:max(2px,.035em);text-underline-offset:.1em}
.nx-m{display:flex;flex-wrap:wrap;gap:.3em 1.5em}
.nx-m i{font-style:italic}

/* Outils d'édition */
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;position:relative;z-index:2}
.tbtn{font-size:var(--fs-s);line-height:1.1;letter-spacing:0;padding:.42em .7em;border:1px solid var(--fg);border-radius:0;background:var(--bg);color:var(--fg);cursor:pointer;white-space:nowrap}
.tbtn:hover:not(:disabled),.tbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.danger{color:var(--danger);border-color:var(--danger)}
.tbtn.danger:hover:not(:disabled),.tbtn[data-armed="1"]{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.seg{display:inline-flex}
.seg .tbtn+.tbtn{border-left:0}
.is-editing [data-f]{outline:1px dashed var(--muted);outline-offset:3px;cursor:text;min-width:2ch}
.is-editing [data-f]:hover{outline-color:var(--fg)}
.is-editing [data-f]:focus{outline:1px solid var(--fg)}
[data-f]:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}

.fab{position:fixed;z-index:50;right:calc(var(--margin) + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border:0;padding:.85em 1.15em;font-size:var(--fs-s);letter-spacing:0;cursor:pointer}
.toolbar{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;padding:4px;background:var(--fg);color:var(--bg);font-size:var(--fs-s);letter-spacing:0}
.tb{background:none;border:0;color:var(--bg);padding:.65em .9em;cursor:pointer}
.tb:hover:not(:disabled){text-decoration:underline;text-underline-offset:.2em}
.tb.primary{background:var(--bg);color:var(--fg)}
.tb:disabled{opacity:.4;cursor:default}
.tb-status{padding:0 .9em;opacity:.7}
.tb-wrap{position:relative}
.panel{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));display:grid;gap:18px;padding:16px;background:var(--bg);color:var(--fg);border:1px solid var(--fg);text-align:left}
.p-h{margin-bottom:.5em}
.p-note{color:var(--muted);margin-bottom:.6em;overflow-wrap:anywhere}
.restore{position:fixed;z-index:50;left:calc(var(--margin) + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(400px,calc(100% - 32px));display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--bg);border:1px solid var(--fg);font-size:var(--fs-s)}
.restore p{flex:1 1 100%}
.toast{cursor:pointer;position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));width:max-content;max-width:calc(100% - 32px);padding:.7em 1em;background:var(--fg);color:var(--bg);font-size:var(--fs-s);letter-spacing:0}

@media (max-width:760px){
  .g{grid-template-columns:repeat(4,minmax(0,1fr))}
  .h-name{grid-column:1/3}
  .h-nav{grid-column:3/5}
  .h-disc{grid-column:1/3;grid-row:2;margin-top:1.2em}
  .st{grid-column:1/-1}
  .switch{grid-column:3/5;justify-content:flex-end}
  .count{display:none}
  .tile,.tile[data-size="L"]{grid-column:span 4}
  .tile[data-size="S"]{grid-column:span 2}
  .tile[data-size="L"] .t-media{aspect-ratio:4/3;--fr:1.33333}
  .tile[data-size="S"] .cap{grid-template-columns:minmax(0,1fr)}
  .tile[data-size="S"] .c-y{grid-column:1;grid-row:3;text-align:left}
  .x-t{grid-column:1/4}
  .x-y{grid-column:4/5;text-align:right}
  .x-c{grid-column:1/-1;grid-row:2}
  .x-d{display:none}
  .x-tools{grid-column:1/-1}
  .ct .lab,.ct-i,.ct-e,.ct-l,.ct-le{grid-column:1/-1;grid-row:auto}
  .back{grid-column:1/3}
  .sb-reg{display:none}
  .sb-n{grid-column:3/5}
  .s-lead,.s-desc{grid-column:1/-1}
  .facts{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr))}
  .facts dt{grid-column:1/2}
  .facts dd{grid-column:2/5}
  .gi{grid-column:1/-1!important}
  .fr-bar{padding-block:10px}
  .s-next .lab,.nx{grid-column:1/-1}
}
/* Couverture : le nom en très grand, l'image du premier projet part de l'emplacement de la photo du CV et s'ouvre en plein écran au défilement */
.hero{position:relative;height:calc(100svh + 120svh)}
.hero-pin{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--bg);isolation:isolate}
.hero.static{height:auto}
.hero.static .hero-pin{position:relative;height:auto;min-height:min(100svh,980px)}
.hero-pin .marks{position:relative;z-index:2}
.blend{position:relative;z-index:2;color:#fff;mix-blend-mode:difference}
.h-mid{align-self:center;align-items:end;padding-block:24px}
.hero .st{grid-column:1/7;opacity:calc(1 - var(--e) * 3)}
.cue{grid-column:12/13;justify-self:end;font-size:var(--fs-s);white-space:nowrap;opacity:calc(1 - var(--e) * 4)}
.giant{margin:0;padding-bottom:clamp(10px,1.6vw,24px);display:grid;line-height:.8;letter-spacing:-.045em;white-space:nowrap;font-weight:400}
.gl{display:block;width:max-content;font-size:16vw}
.gl:nth-child(odd){transform:translateX(calc(var(--e) * -108%))}
.gl:nth-child(even){transform:translateX(calc(var(--e) * 108%))}
.hero-media{position:absolute;inset:0;z-index:1;overflow:hidden;background:var(--tile);
  clip-path:inset(calc(19% * (1 - var(--e))) calc(2.8% * (1 - var(--e))) calc(45% * (1 - var(--e))) calc(69% * (1 - var(--e))))}
.hero-media img,.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(calc(1.3 - .3 * var(--e)))}
.hero-cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding-bottom:22px;align-items:baseline;opacity:clamp(0, calc((var(--e) - .8) * 5), 1)}
.hc-t{grid-column:1/6}
.hc-c{grid-column:6/10;font-style:italic}
.hc-y{grid-column:10/13;text-align:right;font-variant-numeric:tabular-nums}
.hero-hit{position:absolute;inset:0;z-index:2;background:none;border:0;padding:0;cursor:pointer;pointer-events:none}
.hero.ready .hero-hit{pointer-events:auto}
#travaux{padding-top:clamp(64px,8vw,120px)}
.topbar{position:fixed;top:0;left:0;right:0;z-index:35;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;color:#fff;mix-blend-mode:difference;transform:translateY(-110%);transition:transform .5s linear;pointer-events:none}
.topbar.show{transform:none;pointer-events:auto}
.topbar nav{display:flex;gap:1.4em}
.cursor{position:fixed;left:0;top:0;z-index:36;pointer-events:none}
.cursor span{display:grid;place-items:center;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:var(--fs-s);letter-spacing:0;transform:scale(0);transition:transform .35s linear}
.cursor.on span{transform:scale(1)}
.fine .tile .hit,.fine .hero.ready .hero-hit,.fine .ix-band{cursor:none}
@media (prefers-reduced-motion: no-preference){
  .tile .t-media{transition:clip-path 1.1s linear}
  .tile .t-media > img,.tile .t-media > video{transition:transform 1.5s linear}
  .tile .cap{transition:opacity .8s linear .3s,transform .8s linear .3s}
  .tile.pending .t-media{clip-path:inset(100% 0 0 0)}
  .tile.pending .t-media > img,.tile.pending .t-media > video{transform:scale(1.18)}
  .tile.pending .cap{opacity:0;transform:translateY(14px)}
}
@media (max-width:760px){
  .hero .st{grid-column:1/-1}
  .cue{display:none}
  .hero-media{clip-path:inset(calc(15% * (1 - var(--e))) calc(4% * (1 - var(--e))) calc(62% * (1 - var(--e))) calc(56% * (1 - var(--e))))}
  .hc-t{grid-column:1/3}.hc-c{grid-column:1/-1;grid-row:2}.hc-y{grid-column:3/5}
  .topbar nav{gap:1em}
}

/* Cadrage : l'image est posée dans son cadre par position, zoom et format, sans recadrer le fichier */
img.fm,video.fm{position:absolute;max-width:none;right:auto;bottom:auto;object-fit:fill;
  --sw:max(1, calc(var(--ri) / var(--fr)));--sh:max(1, calc(var(--fr) / var(--ri)));
  width:calc(var(--sw) * var(--z) * 100%);height:calc(var(--sh) * var(--z) * 100%);
  left:calc((1 - var(--sw) * var(--z)) * var(--x) * 100%);top:calc((1 - var(--sh) * var(--z)) * var(--y) * 100%)}
img.fm-nf,video.fm-nf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
[data-nat] img.fm-nf,[data-nat] video.fm-nf{position:static;height:auto}
.framer{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fr-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:14px;border-bottom:1px solid var(--line)}
.fr-hint{color:var(--muted)}
.fr-act{display:flex;gap:4px}
.fr-stage-wrap{display:grid;place-items:center;min-height:0;padding:16px}
.fr-stage{position:relative;overflow:hidden;max-width:100%;background:var(--tile);outline:1px solid var(--fg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.fr-stage.grabbing{cursor:grabbing}
.fr-stage img,.fr-stage video{pointer-events:none;-webkit-user-drag:none}
.fr-stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent calc(33.333% - .5px),rgb(255 255 255/.6) calc(33.333% - .5px) calc(33.333% + .5px),transparent calc(33.333% + .5px) calc(66.666% - .5px),rgb(255 255 255/.6) calc(66.666% - .5px) calc(66.666% + .5px),transparent calc(66.666% + .5px)),
             linear-gradient(to bottom,transparent calc(33.333% - .5px),rgb(255 255 255/.6) calc(33.333% - .5px) calc(33.333% + .5px),transparent calc(33.333% + .5px) calc(66.666% - .5px),rgb(255 255 255/.6) calc(66.666% - .5px) calc(66.666% + .5px),transparent calc(66.666% + .5px))}
.fr-ctrl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px;padding-block:14px 18px;border-top:1px solid var(--line);font-size:var(--fs-s)}
.fr-ctrl .seg{flex-wrap:wrap}
.fr-zoom{width:min(240px,60vw);accent-color:var(--fg);margin:0;display:block}
.pf-loading #app{visibility:hidden}
/* ---------- Éditeur : page réelle + panneau de réglages ---------- */
.is-editing.has-sheet .sheet:has(.insp){right:300px}
.is-editing.has-sheet:has(.insp) .topbar{right:300px}
.insp{position:fixed;top:0;right:0;bottom:0;width:300px;z-index:48;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 110px;font-size:13px;line-height:1.35;display:flex;flex-direction:column;gap:14px}
.ins-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ins-k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ins-t{font-size:15px;text-align:right}
.ins-help{margin:0;color:var(--muted)}
.ins-thumb{background:var(--tile);border-radius:4px;overflow:hidden}
.ins-thumb img,.ins-thumb video{display:block;width:100%;max-height:220px;object-fit:contain}
.ins-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:start}
.ins-lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:.45em}
.ins-body{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ins-body .cat-tg{margin:0}
.ins-tip{flex:1 1 100%;font-size:11px;color:var(--muted)}
.ins-f{display:block;flex:1 1 100%;border:1px solid var(--line);padding:.35em .5em;border-radius:3px;min-height:1.6em}
.insp .tbtn{font-size:12px;padding:.38em .6em;border-radius:3px}
.is-editing .hx .hxc.hx-media{cursor:pointer}
.is-editing .hx .hxc.hx-media:hover .hxm{outline:1px dashed #0A0A0A;outline-offset:-1px}
.is-editing .hx .hxc.sel .hxm{outline:2px solid #0A0A0A;outline-offset:-2px}
.is-editing .hx .hxc.sel::after{content:"Sélectionnée";position:absolute;left:8px;top:8px;z-index:7;font-size:11px;color:#fff;background:#0A0A0A;border-radius:3px;padding:.15em .4em}
.is-editing .hx .hxc.dragging{opacity:.35;cursor:grabbing}
.is-editing .hx .hxc.drop-l{box-shadow:inset 4px 0 0 #0A0A0A}
.is-editing .hx .hxc.drop-r{box-shadow:inset -4px 0 0 #0A0A0A}
.is-editing:has(#insp-site) .page{margin-right:300px}
.is-editing:has(#insp-site) .topbar{right:300px}
.is-editing:has(#insp-site) .ib-pin{margin-right:0}
.sheet:has(.insp) .sb-view{display:none}
.has-sheet .sbar .sb-view{margin-top:30px}
.ins-sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ins-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ins-it{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0}
.ins-open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:.3em 0;font:inherit;cursor:pointer;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-open em{font-style:normal;font-size:11px;color:var(--muted)}
.fine .ins-open:hover{text-decoration:underline;text-underline-offset:.2em}
.ins-n{display:inline-block;width:2.2em;color:var(--muted);font-variant-numeric:tabular-nums}
.ins-mv{display:flex;gap:2px;flex:none}
.ins-mv .tbtn{padding:.2em .45em}
.ins-cats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:760px){.is-editing:has(#insp-site) .page{margin-right:0;margin-bottom:46vh}.is-editing:has(#insp-site) .topbar{right:0}}
.hx-add{display:flex;align-items:stretch}
.hx-addb{flex:1;margin:12px;border:1px dashed var(--muted);border-radius:8px;background:none;font:inherit;font-size:14px;cursor:pointer;color:var(--fg)}
.hx-addb small{color:var(--muted);font-size:11px}
.fine .hx-addb:hover{border-color:#0A0A0A;background:var(--tile)}
.is-editing .hx-text [data-f]{outline-offset:2px}
.is-editing .hx-text .hx-t{border-radius:3px}
@media (max-width:760px){.insp{width:100%;top:auto;height:46vh;border-left:0;border-top:1px solid var(--line)}.is-editing.has-sheet .sheet:has(.insp){right:0;bottom:46vh}.is-editing.has-sheet:has(.insp) .topbar{right:0}}

/* ---------- Fiche projet : visionneuse ---------- */
.vw{position:relative;height:calc(100vh - var(--sbh,48px));height:calc(100svh - var(--sbh,48px));display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.vw-stage{position:relative;flex:1 1 auto;min-height:0;cursor:pointer;touch-action:pan-y}
.vw-item{position:absolute;inset:0;visibility:hidden}
.vw-item.cur{visibility:visible}
.vwm.gbox{position:absolute;aspect-ratio:auto!important;background:var(--tile)}
.vw-title{position:absolute;left:12px;top:12px;z-index:4;display:flex;flex-wrap:wrap;gap:4px;align-items:center;pointer-events:none;max-width:70%}
.vw-title b,.vw-count b,.vw-btn b,.vw-close b{font-weight:inherit;color:#fff;background:#0A0A0A;border-radius:4px;padding:.14em .38em .1em;white-space:nowrap}
.vw-title b{font-size:clamp(18px,1.7vw,26px);letter-spacing:-.02em}
.vw-title .vw-sub{font-size:var(--fs-s);letter-spacing:0;border-radius:3px}
.vw-nav{position:absolute;top:50%;z-index:4;transform:translateY(-50%);margin:0;border:0;cursor:pointer;font:inherit;font-size:clamp(16px,1.4vw,22px);line-height:1;color:#fff;background:#0A0A0A;border-radius:4px;padding:.3em .45em .26em}
.vw-prev{left:12px}.vw-next{right:12px}
.fine .vw-nav:hover,.fine .vw-btn:hover b{background:#fff;color:#0A0A0A;box-shadow:inset 0 0 0 1px #0A0A0A}
.vw-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.vw-count{font-size:var(--fs-s);font-variant-numeric:tabular-nums;flex:none}
.vw-thumbs{flex:1 1 auto;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.vw-thumbs::-webkit-scrollbar{display:none}
.vw-th{flex:none;height:52px;padding:0;margin:0;border:0;background:var(--tile);cursor:pointer;border-radius:3px;overflow:hidden;outline:2px solid transparent;outline-offset:-2px}
.vw-th img,.vw-th video{display:block;height:100%;width:auto;max-width:120px;object-fit:cover;pointer-events:none}
.vw-th[aria-current="true"]{outline-color:#0A0A0A}
.fine .vw-th:not([aria-current]):hover{outline-color:var(--muted)}
.vw-btn,.vw-close{flex:none;margin:0;padding:0;border:0;background:none;font:inherit;font-size:var(--fs-s);cursor:pointer}
.vw-info{position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--line);padding:16px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:1.3em;transform:translateX(102%);transition:transform .35s linear}
.vw.info-on .vw-info{transform:none}
.vw-close{align-self:flex-end}
.vw-info .hx-t{font-size:clamp(28px,2.6vw,44px)}
.vw-info .hx-facts{grid-template-columns:repeat(5,minmax(0,1fr))}
.vw-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.is-editing .vw-item.cur[data-mp] .vwm{outline:1px dashed var(--muted);cursor:grab}
.is-editing .vw-item.dragging .vwm{outline:1px solid var(--fg);cursor:grabbing}
.is-editing .vw-stage{cursor:default}
.vw-art .tester{margin-top:0}
@media (max-width:760px){
  .vw-th{height:40px}
  .vw-bar{padding:6px 8px;gap:6px}
  .vw-title{left:8px;top:8px}
  .vw-prev{left:8px}.vw-next{right:8px}
}

/* ---------- Fiche projet horizontale ---------- */

/* accueil : bande horizontale */
#travaux.hh{position:relative;padding:calc(46px + env(safe-area-inset-top,0px)) 0 0}
.hh-pin{position:relative;height:calc(100vh - 46px - env(safe-area-inset-top,0px));height:calc(100svh - 46px - env(safe-area-inset-top,0px));min-height:320px;overflow:hidden;background:var(--bg)}
.hh-track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab;-webkit-user-select:none;user-select:none}
.hh-track::-webkit-scrollbar{display:none}
.hh-track.grab,.hh-track.grab .hhc{cursor:grabbing}
.hhc{position:relative;flex:0 0 auto;height:100%;display:flex;flex-direction:column;color:var(--fg);text-decoration:none;cursor:pointer;--hxs:clamp(15px,1.3vw,20px)}
.hh-m{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--tile)}
.hh-m img,.hh-m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;visibility:hidden}
.hh-m .on{visibility:visible}
.hh-cap{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:1em;padding:.5em 12px 1.1em 10px;font-size:var(--hxs);line-height:1.35}
.hh-t,.hh-d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hh-d{grid-column:1/-1;color:var(--muted)}
.hh-y{color:var(--muted);font-variant-numeric:tabular-nums}
.fine .hhc:hover .hh-t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.hh-n{position:absolute;right:8px;bottom:8px;z-index:2;font-size:var(--fs-s);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s linear;pointer-events:none}
.hh-n b,.hh-cue b{font-weight:inherit;color:#fff;background:#0A0A0A;border-radius:3px;padding:.12em .3em .08em}
.fine .hhc:hover .hh-n{opacity:1}
.hh-cue{position:absolute;right:12px;top:12px;z-index:5;font-size:var(--fs-s);pointer-events:none;transition:opacity .3s linear}
.hh.moved .hh-cue{opacity:0}
.hh .hx-arr{top:calc(50% - 1.7em)}
.hh.at-start .hx-l,.hh.at-end .hx-r{opacity:0;pointer-events:none}
.hhc:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
@keyframes hhIn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.hh-m{animation:hhIn .6s linear both;animation-delay:calc(var(--k) * 70ms)}
.is-editing .hh-m{animation:none}
@media (prefers-reduced-motion:reduce){.hh-m{animation:none}}
@media (max-width:760px){.hh-cap{padding:.45em 10px 1em 8px}}

/* accueil : colonnes qui s'ouvrent au défilement (version horizontale des bandes) */
#travaux.hb{padding:0}
.hb{position:relative;height:calc(100vh + 60vh + var(--n) * 55vh);height:calc(100svh + 60svh + var(--n) * 55svh)}
.hb-pin{position:sticky;top:0;height:100vh;height:100svh;box-sizing:border-box;padding-top:calc(46px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.hb-row{flex:1 1 auto;min-height:0;display:flex}
.hb-c{position:relative;display:block;flex:1 1 0;min-width:0;overflow:hidden;color:#fff;text-decoration:none;cursor:pointer;background:var(--tile);-webkit-user-select:none;user-select:none}
.hb-m{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hb-m img,.hb-m video{position:absolute;top:0;left:50%;height:100%;width:max(var(--IW,55vw),100%);transform:translateX(-50%);object-fit:cover;display:block;visibility:hidden}
.hb-m .on{visibility:visible}
.hb-t{position:absolute;left:8px;bottom:10px;z-index:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:var(--tf,32px);line-height:1.02;letter-spacing:-.035em;white-space:nowrap;max-height:calc(100% - 20px);overflow:hidden;pointer-events:none}
.hb-t b{font-weight:inherit;color:#fff;background:#0A0A0A;border-radius:max(4px,.14em);padding:.16em .1em .12em .02em;display:inline-block}
.fine .hb-c:hover .hb-t b{background:#fff;color:#0A0A0A}
.hb-i{position:absolute;left:calc(var(--tf,32px) * 1.12 + 18px);right:10px;bottom:10px;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:1em;font-size:var(--fs-s);white-space:nowrap;opacity:clamp(0,calc((var(--o,0) - .6) * 3),1);pointer-events:none}
.hb-d{color:#fff;background:#0A0A0A;border-radius:3px;padding:.12em .3em .08em;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hb-r{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.hb-r b,.hb-cue b{font-weight:inherit;color:#fff;background:#0A0A0A;border-radius:3px;padding:.12em .3em .08em}
.hb-cue{position:absolute;right:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;font-size:var(--fs-s);pointer-events:none;transition:opacity .3s linear}
.hb.moved .hb-cue{opacity:0}
.hb-c:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}

/* ordi : colonnes animées par transformations (aucun tremblement) */
.hb.hb-gpu .hb-row{position:relative;display:block}
.hb.hb-gpu .hb-c{position:absolute;left:0;top:0;bottom:0;width:var(--BW,55vw);flex:none;will-change:transform,clip-path;contain:layout paint style}
.hb.hb-gpu .hb-m img,.hb.hb-gpu .hb-m video{left:0;width:100%;transform:none}
.hb.hb-gpu .hb-i{right:auto;width:calc(var(--IW,55vw) - var(--tf,32px) * 1.12 - 28px)}
html,body{overscroll-behavior:none}
/* une fois l'image arrivée, plus de fond gris derrière : les PNG détourés restent sur blanc */
.hb-c.is-ld,.ibr-m.is-ld,.hh-m.is-ld,.hxm.gbox.is-ld,.vwm.gbox.is-ld{background:transparent}

/* À propos façon CV : grille suisse, un seul corps de texte */
.cv{--cvs:clamp(15px,1.2vw,19px);font-size:var(--cvs);line-height:1.3;padding-bottom:clamp(60px,8vw,120px)}
.cv h1,.cv h2,.cv p{margin:0;font:inherit;letter-spacing:inherit}
.cv-head{padding-top:clamp(40px,5vw,80px);align-items:start}
.cv-name{grid-column:1/6;white-space:pre-line}
.cv-ct{grid-column:6/10;display:flex;flex-direction:column}
.is-editing .cv-ct{gap:14px}
.cv-ct .ct-e,.cv-ct .ct-le{grid-column:auto}
.cv-copy{border:0;background:none;padding:0;margin-left:.6em;font:inherit;color:var(--muted);cursor:pointer}
.fine .cv-copy:hover{color:var(--fg)}
.cv-intro{margin-top:clamp(28px,3.4vw,52px)}
.cv-txt{grid-column:1/8;white-space:pre-line;max-width:60ch}
.cv-sec{margin-top:clamp(48px,5.4vw,86px);align-items:start;row-gap:1.6em}
.cv-lab{grid-column:1/3;grid-row:1/span var(--rows,1)}
.cv-row{grid-column:3/13;display:grid;grid-template-columns:1.1fr 1fr .85fr 1.25fr;column-gap:var(--gutter);position:relative}
.cv-c{white-space:pre-line;min-width:0;overflow-wrap:break-word}
.cv-c em{font-style:italic}
.cv-wide{grid-column:3/5}
.cv-c strong{font-weight:600}
.cv-half{color:var(--muted)}
/* notes : * plus gros, centré sur la ligne ; demi-note = * en contour */
.cv-st{display:inline-block;width:.78em;height:.78em;vertical-align:-.04em;margin-right:.12em;overflow:visible}
.cv-tools{display:flex;gap:4px;align-self:start}
.is-editing .cv-row{grid-template-columns:1.1fr 1fr .85fr 1.25fr auto}
.cv-add{grid-column:3/13;display:flex;flex-wrap:wrap;gap:6px}
.cv-add-sec{margin-top:clamp(40px,5vw,80px);align-items:center}
.cv-tip{color:var(--muted);font-size:var(--fs-s)}
.is-editing .cv-c{min-height:1.3em}
@media (max-width:760px){
  .cv-name{grid-column:1/3}.cv-ct{grid-column:3/5}
  .cv-txt{grid-column:1/-1}
  .cv-lab{grid-column:1/-1;grid-row:auto}
  .cv-row{grid-column:1/-1;grid-template-columns:1fr 1fr;row-gap:.5em}
  .cv-wide{grid-column:auto}
  .cv-tools{grid-column:1/-1}
  .is-editing .cv-row{grid-template-columns:1fr 1fr}
  .cv-add{grid-column:1/-1}
}
.hx{position:relative}
.hx-pin{position:relative;height:min(78vh,860px);height:min(78svh,860px);overflow:hidden;background:var(--bg)}
.hx-track{display:flex;height:100%;align-items:center;gap:0;padding:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab;-webkit-user-select:none;user-select:none}
.hx-track::-webkit-scrollbar{display:none}

      .catch(function(e){ return null; }) : Promise.resolve(null);
    return tryMp4.then(function(r){
      if (r) return r;

      if (f.size <= G_TARGET && Math.max(info.w, info.h) <= MAX_EDGE) return {blob:f, w:info.w, h:info.h, kind:'image', type:'image/gif', kept:true};

function videoErrorText(code, name){

  if (code === 'no_muxer') return 'Le module de compression vidéo n\'a pas pu se charger. Vérifie ta connexion et réessaie.';
  return 'Ce navigateur ne sait pas compresser « ' + name + ' ». Essaie dans Chrome ou Edge à jour, ou compresse-la avec HandBrake.';
}

function uploadMedia(multiple, key, done){

  pickFile(PICK_ACCEPT, multiple, function(files){ uploadFiles(files, key, done); });

function uploadFiles(files, key, done){
  if (!assetsNS) { toast('L\'envoi de fichiers n\'est pas disponible dans cette vue. Recharge la page et réessaie.'); return; }
  busy[key] = true; render();
  var out = [], failed = [], resized = 0, squeezed = 0, mute = [], chain = Promise.resolve();
  files.forEach(function(f, k){
    var prefix = files.length > 1 ? (k + 1) + '/' + files.length + ' · ' : '';
    function send(blob, type, kind, w, h, extra){
      toast(prefix + 'Envoi de ' + f.name + '…', true);
      return uploadBlob(blob, type).then(function(r){
        var src = r && typeof r.id === 'string' ? '/_blob/' + r.id : '';
        if (!BLOB.test(src)) { failed.push('« ' + f.name + ' » a été envoyé mais sa référence est illisible. Réessaie.'); return; }
        remember(r.id, r.url);
        var item = {src:src, kind:kind};
        if (w > 0 && h > 0) { item.w = w; item.h = h; }
        if (extra && extra.gif) item.gif = true;
        out.push(item);
      }, function(err){ failed.push(uploadErrorText(err && err.code, f.name)); });
    }
    chain = chain.then(function(){
      var isVideo = /^video\//.test(f.type) || /\.(mp4|webm|mov|m4v)$/i.test(f.name);
      if (isVideo) {
        var vt = mediaType(f);

        }
        if (!canTranscode()) { failed.push(videoErrorText('no_webcodecs', f.name)); return; }
        return avcOK().then(function(avc){
          /* sans encodeur H.264 (ex. application de bureau), on garde l'original s'il passe : le VP9 ne se lit pas sur iPhone */
          if (!avc && vt && f.size <= HARD) {
            var tmp2 = {src:'', kind:'video'}, u2 = URL.createObjectURL(f);
            urls[''] = u2;
            return probeDims(tmp2).then(function(){ URL.revokeObjectURL(u2); delete urls['']; return send(f, vt, 'video', tmp2.w, tmp2.h); });
          }
          var lastPct = -1;
          toast(prefix + 'Compression de ' + f.name + '… Garde cet onglet ouvert.', true);
          return compressVideo(f, function(p){
            var pct = Math.round(p * 100);
            if (pct !== lastPct) { lastPct = pct; toast(prefix + 'Compression de ' + f.name + ' : ' + pct + ' %. Garde cet onglet ouvert.', true); }
          }).then(function(r){
            if (r.blob.size > HARD) { failed.push('« ' + f.name + ' » est trop longue pour tenir sous 20 Mo, même compressée. Coupe-la ou mets un lien Vimeo dans la fiche projet.'); return; }
            squeezed++; if (r.audioLost) mute.push(f.name);
            if (r.vp9) failed.push('« ' + f.name + ' » a été compressée dans un format que l\'iPhone ne lit pas. Pour une vidéo lisible partout, importe-la depuis Chrome ou Safari (pas depuis l\'application Claude), ou exporte-la en MP4 H.264 de moins de 20 Mo.');
            return send(r.blob, 'video/mp4', 'video', r.w, r.h);
          }, function(err){ failed.push(videoErrorText(err && err.code, f.name)); });
        });
      }
      if (mediaType(f) === 'image/gif') {
        if (!window.PFGif) { failed.push('Le module GIF n\'a pas pu se charger. Recharge la page.'); return; }
        var gPct = -1;
        toast(prefix + 'Compression de ' + f.name + '…', true);
        return compressGif(f, function(p){
          var pct = Math.round(p * 100);
          if (pct !== gPct) { gPct = pct; toast(prefix + 'Compression de ' + f.name + ' : ' + pct + ' %. Garde cet onglet ouvert.', true); }
        }).then(function(r){
          if (r.blob.size > HARD) { failed.push('« ' + f.name + ' » reste au-dessus de 20 Mo même compressé. Raccourcis-le ou exporte-le en MP4.'); return; }
          if (!r.kept) squeezed++;

      }
      toast(prefix + 'Optimisation de ' + f.name + '…', true);
      return prepareImage(f).then(function(p){
        if (p.resized) resized++;

      }, function(err){
        if (err && err.code === 'too_large') failed.push('« ' + f.name + ' » reste trop lourd même compressé. Exporte-le en JPG.');
        else failed.push('« ' + f.name + ' » ne peut pas être lu par ce navigateur' + (/\.(heic|heif|tiff?)$/i.test(f.name) ? ' (format HEIC ou TIFF). Exporte-le en JPG, ou ouvre le site dans Safari.' : '. Exporte-le en JPG ou PNG.'));

    busy[key] = false;
    if (out.length) { done(out); markDirty(); }
    render();

    var ok = out.length ? (out.length > 1 ? out.length + ' fichiers ajoutés' : 'Fichier ajouté') + (notes.length ? ' (' + notes.join(', ') + ')' : '') + '.' + (FILES_OK === false ? ' Clique sur Enregistrer pour les garder.' : '') : '';

  });
}

function dropZone(el){ return el && el.closest ? el.closest('[data-drop]') : null; }

/* Enregistrement : l'état part dans un fichier state.json publié avec la page (la vue continue sans recharger),
   avec repli sur la republication de la page entière si ce mode n'est pas disponible. */
function save(retried, auto){
  if (!artifactNS) return;
  if (saving) { if (auto) scheduleAutosave(); return; }
  if (auto && FILES_OK === false) return;
  if (FILES_OK === false) return htmlSave(retried);
  saving = true; updateToolbar();
  var prev = state.savedAt, myRev = rev;
  state.savedAt = new Date().toISOString();
  writeDraft({kind:'save', savedAt:state.savedAt, data:state});
  /* la page elle-même est republiée avec l'état intégré, pour les appareils qui ne lisent pas state.json */
  function attempt(withPage){
    var files = {}; files[STATE_FILE] = {content: JSON.stringify(state), contentType: 'application/json'};
    if (withPage) { try { files['index.html'] = {content: buildDocument(), contentType: 'text/html'}; } catch (e) {} }
    try { return artifactNS.publish(files); } catch (e) { return Promise.reject({code:'capability_removed'}); }
  }
  var pr = attempt(EMBED_OK !== false).catch(function(err){
    var c = err && err.code;
    if (EMBED_OK !== false && (c === 'read_only_path' || c === 'invalid_content')) { EMBED_OK = false; return attempt(false); }
    throw err;
  });
  pr.then(function(){
    if (EMBED_OK === null) EMBED_OK = true;
    FILES_OK = true; saving = false; ORIGINAL = JSON.stringify(state);
    if (rev === myRev) { dirty = false; clearDraft(); } else scheduleAutosave();
    updateToolbar();
    if (!auto) toast('Enregistré.');
  }, function(err){
    var c = err && err.code; saving = false; state.savedAt = prev;
    if (['capability_disabled','capability_removed','invalid_content','read_only_path','transform_error'].indexOf(c) >= 0) {
      FILES_OK = false; updateToolbar(); render();
      if (auto) { toast('L\'enregistrement automatique n\'est pas disponible ici : clique sur Enregistrer pour publier tes changements.', true); return; }
      return htmlSave(retried);
    }
    onSaveError(c, retried, auto);
  });
}
function htmlSave(retried){
  if (saving) return;
  saving = true; updateToolbar();
  var prev = state.savedAt;
  state.savedAt = new Date().toISOString();
  writeDraft({kind:'save', savedAt:state.savedAt, data:state});
  var html;
  try { html = buildDocument(); } catch (e) { saving = false; state.savedAt = prev; updateToolbar(); toast('L\'enregistrement a échoué. Réessaie.'); return; }
  artifactNS.publish(html).then(function(){
    var s = document.getElementById('tb-status'); if (s) s.textContent = 'Enregistré, rechargement…';
  }, function(err){ saving = false; state.savedAt = prev; onSaveError(err && err.code, retried, false); });
}
function onSaveError(c, retried, auto){
  if (c === 'conflict') { toast('Une version plus récente existe. La page se recharge et te proposera de restaurer tes modifications.'); return; }
  if (c === 'upstream_error' && !retried) { setTimeout(function(){ save(true, auto); }, 1200 + Math.random() * 800); return; }
  writeDraft({kind:'edit', data:state});
  if (['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'].indexOf(c) >= 0) {
    toast('Cette vue est en lecture seule : l\'enregistrement n\'est pas possible ici. Tes modifications restent en brouillon sur cet appareil.', true);
    canEdit = false; editing = false; render(); return;
  }
  if (c === 'too_large') toast('Le site est trop lourd pour être enregistré. Raccourcis quelques textes.', true);
  else if (c === 'rate_limited') { toast('Trop d\'enregistrements d\'affilée, nouvel essai dans quelques secondes.'); setTimeout(function(){ if (dirty) save(false, true); }, 6000); }
  else toast('L\'enregistrement a échoué. Réessaie dans un instant.', true);
  updateToolbar();
}

    var boot = '<script>' + Object.keys(cfg).map(function(k){ return 'window.' + k + '=' + fxEsc(cfg[k]) + ';'; }).join('') + '<\/script>';
    var fr = document.createElement('iframe');
    fr.title = 'Plan de travail — ' + (p.title || ''); fr.setAttribute('allow', 'clipboard-write');
    fr.srcdoc = html.replace('<head>', '<head>' + boot);
    box.appendChild(fr);
    fr.addEventListener('load', function(){
      fxFit(box, fr);
      try { if (window.ResizeObserver) new ResizeObserver(function(){ fxFit(box, fr); }).observe(fr.contentWindow.document.body); } catch (e) {}
    });
  }).catch(function(){ var l = box.querySelector('.fx-load'); if (l) l.textContent = 'Le plan de travail ne se charge pas.'; });
}
function fxMount(){
  var boxes = app.querySelectorAll('.fx-frame[data-fx]'); if (!boxes.length) return;
  if (!fxIO && window.IntersectionObserver) fxIO = new IntersectionObserver(function(es){
    es.forEach(function(en){
      if (en.isIntersecting) fxLoad(en.target);
      else { var fr = en.target.querySelector('iframe'); if (fr) fxReply(fr.contentWindow, {type: 'fx-sleep'}); }
    });
  }, {rootMargin: '600px 0px'});
  if (fxIO) fxIO.disconnect();
  Array.prototype.forEach.call(boxes, function(b){ if (fxIO) fxIO.observe(b); else fxLoad(b); });
}
function fxReply(src, m){ try { src.postMessage(m, '*'); } catch (e) {} }
/* plan de travail en plein écran : la même fenêtre (la composition est gardée), sans conflit avec le défilement de la page */
function fxFull(id, on){
  var box = app.querySelector('.fx-frame[data-fx="' + id + '"]'); if (!box) return;
  box.classList.toggle('fx-full', !!on);
  document.documentElement.classList.toggle('fx-fs', !!on);
  var fr = box.querySelector('iframe');
  if (!fr) { fxLoad(box); return; }
  fxReply(fr.contentWindow, {type: 'fx-full', on: !!on});
  if (!on) setTimeout(function(){ fxFit(box, fr); }, 80);
}
function fxBlobSave(name, data){
  var u = URL.createObjectURL(new Blob([data], {type: 'image/svg+xml'})), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ a.remove(); URL.revokeObjectURL(u); }, 3000);
}
window.addEventListener('message', function(e){
  var fr = null;
  Array.prototype.forEach.call(app.querySelectorAll('.fx-frame iframe'), function(f){ if (e.source === f.contentWindow) fr = f; });
  if (!fr) return;
  var d = e.data || {};
  if (d.type === 'fx-ready') { fr.parentNode.classList.add('ready'); fxFit(fr.parentNode, fr); if (fr.parentNode.classList.contains('fx-full')) fxReply(fr.contentWindow, {type: 'fx-full', on: true}); return; }
  if (d.type === 'fx-want-full') { fxFull(fr.parentNode.getAttribute('data-fx'), true); return; }
  if (d.type === 'fx-close') { fxFull(fr.parentNode.getAttribute('data-fx'), false); return; }
  if (d.type === 'fx-download' && typeof d.data === 'string') {
    var name = String(d.filename || 'compo.svg').replace(/[^\w.\- ]+/g, '').slice(0, 80) || 'compo.svg';
    if (!/\.svg$/i.test(name)) name += '.svg';
    var src = e.source;
    var use = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
    use.then(function(dl){
      if (!dl) { fxBlobSave(name, d.data); fxReply(src, {type: 'fx-download-result', ok: true, filename: name}); return; }
      return dl.save({filename: name, data: d.data}).then(function(){
        fxReply(src, {type: 'fx-download-result', ok: true, filename: name});
      }, function(err){
        var c = err && err.code;
        fxReply(src, {type: 'fx-download-result', ok: false, msg: c === 'declined' ? 'Export annulé.' : (c === 'rate_limited' ? 'Un export est déjà en attente.' : 'Export indisponible ici.')});
      });
    }, function(){ fxReply(src, {type: 'fx-download-result', ok: false, msg: 'Export indisponible ici.'}); });
  }
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  var fxo = app.querySelector('.fx-frame.fx-full'); if (fxo) { fxFull(fxo.getAttribute('data-fx'), false); return; }
  var a = document.activeElement;
  if (a && a.getAttribute && a.getAttribute('data-f')) { a.blur(); return; }
  if (framer) { framer = null; render(); return; }
  if (styleOpen) { styleOpen = false; render(); return; }
  if (openId) { closeProject(); return; }
  if (aboutOpen) closeAbout();
});
window.addEventListener('hashchange', function(){
  var id = decodeURIComponent(location.hash.slice(1));
  if (id === 'a-propos') { if (!aboutOpen) openAbout(); return; }
  if (findIndex(id) >= 0 && openId !== id) openProject(id);
});
function copyEmail(){
  var text = str(state.contact.email).trim(); if (!text) return;
  function fallback(){
    var el = document.getElementById('email-text');
    if (el) { try { window.getSelection().selectAllChildren(el); } catch (e) {} }
    toast('Address selected: copy it with Ctrl+C or Cmd+C.');
  }
  try { navigator.clipboard.writeText(text).then(function(){ toast('Address copied.'); }, fallback); } catch (e) { fallback(); }
}

/* ---------- démarrage ---------- */
var booted = false;
function bootWith(saved){
  if (booted) {
    if (saved && !editing && !dirty) { state = normalize(saved); ORIGINAL = JSON.stringify(state); checkDraft(); applyLook(); applyFonts(); render(); }
    return;
  }
  booted = true;
  if (saved) { state = normalize(saved); ORIGINAL = JSON.stringify(state); }
  checkDraft();
  if (canEdit) draftOffer = !!draftCandidate;
  root.classList.remove('pf-loading');
  applyLook();
  applyFonts();
  var id = decodeURIComponent((location.hash || '').slice(1));
  if (id && findIndex(id) >= 0) { openId = id; lastFocusId = id; }
  else if (id === 'a-propos') aboutOpen = true;
  if (!openId && !aboutOpen && !REDUCED) pfIntro();
  render();
}
/* ---------- entrée : les bandes s'ouvrent de haut en bas (à chaque ouverture de l'accueil) ---------- */
function pfIntro(){
  var done = false, evs = ['pointerdown', 'wheel', 'keydown', 'touchstart'], t0 = performance.now(), tE = setTimeout(end, 1400);
  ibIn = 0;
  /* les bandes s'ouvrent l'une après l'autre depuis le haut, en linéaire, comme au défilement */
  (function tick(now){ if (done) return; ibIn = clamp((now - t0 - 150) / 1100, 0, 1); updateIB(); if (ibIn < 1) requestAnimationFrame(tick); else end(); })(t0);
  function end(){
    if (done) return; done = true; clearTimeout(tE);
    ibIn = 1; updateIB();
    evs.forEach(function(ev){ window.removeEventListener(ev, end, true); });
  }
  /* un clic, une molette ou une touche passe l'animation */
  evs.forEach(function(ev){ window.addEventListener(ev, end, {capture:true, passive:true}); });
}
root.classList.add('pf-loading');
/* site public (Netlify) : l'état est déjà dans la page, on affiche tout de suite sans attendre de requête */
if (PUBLIC) bootWith(null); else try {
  fetch(STATE_FILE, {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ bootWith(j && typeof j === 'object' && Array.isArray(j.projects) ? j : null); }, function(){ bootWith(null); });
} catch (e) { bootWith(null); }
setTimeout(function(){ bootWith(null); }, 4000);

if (window.claude && typeof window.claude.use === 'function') {
  Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function(r){
    artifactNS = r[0];
    var u = r[1];
    return (u ? u.canEdit().catch(function(){ return false; }) : Promise.resolve(false)).then(function(ce){
      if (!artifactNS || !ce) return;
      canEdit = true;
      draftOffer = !!draftCandidate;
      return window.claude.use('assets').then(function(a){ assetsNS = a; }, function(){}).then(function(){
        if (booted) render();
        if (assetsNS && typeof assetsNS.list === 'function') {
          assetsNS.list().then(function(res){
            (res && res.assets || []).forEach(function(a){ if (a && typeof a.id === 'string') remember(a.id, a.url); });
            applyFonts(); if (booted) render(); fillFontData();
          }, function(){ fillFontData(); });
        }
      });
    });
  }).catch(function(){});
}
})();
